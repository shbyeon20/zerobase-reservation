version: '3.8'


services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: reservation-rabbitmq
    ports:
      - "5672:5672"   # AMQP 프로토콜 포트
      - "15672:15672" # RabbitMQ 관리 UI 포트
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testuser
    restart: always

  mysql:
    image: mysql:8.0
    container_name: reservation-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reservation
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testuser
    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis:latest
    container_name: reservation-redis
    restart: always
    ports:
      - "6379:6379"  # Redis 기본 포트
    command: redis-server --maxmemory-policy allkeys-lfu
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
